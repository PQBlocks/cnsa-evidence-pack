[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqblocks-cnsa-evidence"
version = "0.1.0"
description = "CNSA 2.0 evidence pack generator for quantum-safe compliance, CBOM generation, and migration scheduling."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "The PQBlocks Authors"}]
keywords = ["post-quantum", "pqc", "cnsa", "cnsa-2.0", "cbom", "compliance", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["cryptography", "pyyaml", "toml"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/PQBlocks/cnsa-evidence-pack"
Documentation = "https://github.com/PQBlocks/cnsa-evidence-pack#readme"
Source = "https://github.com/PQBlocks/cnsa-evidence-pack"
Changelog = "https://github.com/PQBlocks/cnsa-evidence-pack/blob/main/CHANGELOG.md"
Issues = "https://github.com/PQBlocks/cnsa-evidence-pack/issues"
Security = "https://github.com/PQBlocks/cnsa-evidence-pack/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
